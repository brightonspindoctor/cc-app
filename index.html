<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>CC</title>
    <style>
      body { margin: 0; background: #f6f1e7; color: #141414; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      main { max-width: 460px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 40px) 22px 40px; }
      h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 6px; }
      p { color: #6d6a64; margin: 0 0 28px; line-height: 1.4; }
      a { display: flex; align-items: center; gap: 16px; padding: 16px; margin-bottom: 14px; background: #fffdf8; border: 1px solid #e4ddcf; border-radius: 14px; text-decoration: none; color: inherit; }
      img { width: 60px; height: 60px; border-radius: 14px; }
      strong { display: block; font-size: 21px; letter-spacing: -0.01em; }
      span { font-size: 14px; color: #6d6a64; }
      small { display: block; margin-top: 26px; font-size: 13px; color: #6d6a64; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>CC</h1>
      <p>Two little daily apps. Open each one and add it to your home screen.</p>
      <a href="./protocol/"><img src="./protocol/icon-180.png" alt="" /><div><strong>The Switzerland Protocol</strong><span>A word a day in French, German and Italian</span></div></a>
      <a href="./bandit/"><img src="./bandit/icon-180.png" alt="" /><div><strong>One Ab Bandit</strong><span>Three ab exercises a day, by slot machine</span></div></a>
      <small>On iPhone: open the app in Safari, tap Share, then Add to Home Screen.</small>
    </main>
  </body>
</html>
